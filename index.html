<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ujumbo - AI Crop Disease & Farmer Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7ee;
      color: #173b20;
    }

    header {
      background: #216e39;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #b7cdb9;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #216e39;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #18572c;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f0f8f0;
      border-left: 5px solid #216e39;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #52705a;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌱 Ujumbo</h1>
  <select id="language" onchange="changeLanguage()">
  <option value="en">🇬🇧 English</option>
  <option value="ta">🇮🇳 தமிழ்</option>
  </select>
  <p>AI Crop Disease & Farmer Assistant</p>
</header>

<div class="container">

  <div class="card">

    <h2>🌾 Crop Health Assistant</h2>

    <p>
      Enter your crop name and describe the symptoms you observe.
    </p>

    <label for="crop">Crop Name</label>
<select id="crop">
  <option value="">Select your crop</option>
  <option value="Tomato">🍅 Tomato</option>
  <option value="Rice">🌾 Rice</option>
  <option value="Potato">🥔 Potato</option>
  <option value="Chilli">🌶️ Chilli</option>
  <option value="Maize">🌽 Maize</option>
</select>

    <label for="symptoms">Symptoms</label>
    <textarea id="symptoms"
      placeholder="Describe symptoms" ></textarea>
    <div class="symptoms">
  <p><strong>Choose a symptom:</strong></p>
      <p><strong>Or take a crop photo:</strong></p>

<input
  type="file"
  id="cropPhoto"
  accept="image/*"
  capture="environment"
>

<p id="photoMessage"></p>
      <img id="photoPreview" style="display:none; max-width:100%; margin-top:10px; border-radius:10px;">

  <button type="button" onclick="selectSymptom('Brown spots on leaves')">
    🟤 Brown spots
  </button>

  <button type="button" onclick="selectSymptom('Yellow leaves')">
    🟡 Yellow leaves
  </button>

  <button type="button" onclick="selectSymptom('Curled leaves')">
    🍃 Curled leaves
  </button>

  <button type="button" onclick="selectSymptom('White powder on leaves')">
    ⚪ White powder
  </button>

  <button type="button" onclick="selectSymptom('Black spots on leaves')">
    ⚫ Black spots
  </button>
    </div>

    <button onclick="analyzeCrop()">
      🔍 Identify Possible Disease
    </button>

    <div id="result"></div>

  </div>

</div>

<footer>
  Ujumbo | AI-powered Crop Disease Detection & Farmer Assistant
</footer>

<script>
  function selectSymptom(symptom) {
  document.getElementById("symptoms").value = symptom;
  }
  document.getElementById("cropPhoto").addEventListener("change", function () {
  const file = this.files[0];
  const preview = document.getElementById("photoPreview");
  const message = document.getElementById("photoMessage");

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    preview.src = event.target.result;
    preview.style.display = "block";
    message.textContent = "📷 Crop photo added. Please select the crop and choose the visible symptom, then tap Analyze Crop.";
  };

  reader.readAsDataURL(file);
});
  function changeLanguage() {
  const language = document.getElementById("language").value;

  if (language === "ta") {
    document.querySelector("h1").textContent = "🌱 Ujumbo";
    document.querySelector("p").textContent = "விவசாயி பயிர் நோய் உதவியாளர்";
  } else {
    document.querySelector("h1").textContent = "🌱 Ujumbo";
    document.querySelector("p").textContent = "AI Crop Disease & Farmer Assistant";
  }
  }
function analyzeCrop() {

  const crop = document.getElementById("crop").value.toLowerCase().trim();
  const symptoms = document.getElementById("symptoms").value.toLowerCase().trim();
  const result = document.getElementById("result");

  if (crop === "" || symptoms === "") {
    result.style.display = "block";
    result.innerHTML =
      "<strong>⚠️ Please enter both the crop name and symptoms.</strong>";
    return;
  }

  let disease = "Possible crop health problem";
  let advice =
    "Monitor the crop carefully, remove severely damaged plant parts, maintain proper irrigation and consult a local agricultural expert for confirmation.";

  let matched = false;

  /* =========================
     TOMATO
  ========================= */

  if (crop.includes("tomato")) {

    if (
      (symptoms.includes("brown") || symptoms.includes("dark")) &&
      (symptoms.includes("spot") || symptoms.includes("spots")) &&
      (symptoms.includes("leaf") || symptoms.includes("leaves"))
    ) {
      disease = "Possible Tomato Early Blight";
      advice =
        "Remove badly affected leaves, avoid watering the leaves from above, improve air circulation and follow locally recommended disease-management practices.";
      matched = true;
    }

    else if (
      symptoms.includes("curl") ||
      symptoms.includes("curled") ||
      symptoms.includes("curling")
    ) {
      disease = "Possible Tomato Leaf Curl Problem";
      advice =
        "Check the underside of leaves for insects, remove severely affected leaves and monitor the plants regularly. Use locally recommended pest-management practices if insects are present.";
      matched = true;
    }

    else if (
      symptoms.includes("white") &&
      (symptoms.includes("powder") || symptoms.includes("coating"))
    ) {
      disease = "Possible Tomato Powdery Mildew";
      advice =
        "Improve air circulation, avoid excessive humidity around the leaves and remove severely affected plant material.";
      matched = true;
    }

    else if (
      symptoms.includes("yellow") &&
      (symptoms.includes("leaf") || symptoms.includes("leaves"))
    ) {
      disease = "Possible Tomato Yellowing / Nutrient Stress";
      advice =
        "Check watering, drainage and plant nutrition. Look for insects and inspect whether yellowing starts on older or newer leaves.";
      matched = true;
    }
  }


  /* =========================
     RICE
  ========================= */

  else if (crop.includes("rice")) {

    if (
      (symptoms.includes("brown") || symptoms.includes("dark")) &&
      (symptoms.includes("spot") || symptoms.includes("spots"))
    ) {
      disease = "Possible Rice Brown Spot";
      advice =
        "Use healthy seed, maintain balanced plant nutrition and good field management. Follow locally recommended disease-control practices.";
      matched = true;
    }

    else if (
      symptoms.includes("diamond") ||
      symptoms.includes("gray") ||
      symptoms.includes("grey") ||
      symptoms.includes("lesion")
    ) {
      disease = "Possible Rice Blast";
      advice =
        "Inspect nearby plants for similar lesions, avoid excessive nitrogen application and follow locally recommended rice-blast management practices.";
      matched = true;
    }

    else if (
      symptoms.includes("yellow") &&
      (symptoms.includes("leaf") || symptoms.includes("leaves"))
    ) {
      disease = "Possible Rice Nutrient Stress";
      advice =
        "Check water management and plant nutrition. Compare affected and healthy plants and seek local agricultural advice if yellowing spreads.";
      matched = true;
    }
  }


  /* =========================
     POTATO
  ========================= */

  else if (crop.includes("potato")) {

    if (
      (symptoms.includes("brown") || symptoms.includes("dark")) &&
      (symptoms.includes("spot") || symptoms.includes("spots"))
    ) {
      disease = "Possible Potato Blight";
      advice =
        "Remove severely affected foliage, reduce prolonged leaf wetness and follow locally recommended disease-management practices.";
      matched = true;
    }

    else if (
      symptoms.includes("yellow") &&
      (symptoms.includes("leaf") || symptoms.includes("leaves"))
    ) {
      disease = "Possible Potato Plant Stress";
      advice =
        "Check soil moisture, drainage and plant nutrition. Inspect the plants for insects or disease symptoms.";
      matched = true;
    }
  }


  /* =========================
     CHILLI / PEPPER
  ========================= */

  else if (
    crop.includes("chilli") ||
    crop.includes("chili") ||
    crop.includes("pepper")
  ) {

    if (
      symptoms.includes("curl") ||
      symptoms.includes("curled") ||
      symptoms.includes("curling")
    ) {
      disease = "Possible Chilli Leaf Curl Problem";
      advice =
        "Inspect the leaves for small insects, remove severely affected leaves and monitor new growth. Follow locally recommended pest-management practices.";
      matched = true;
    }

    else if (
      (symptoms.includes("brown") || symptoms.includes("black")) &&
      (symptoms.includes("spot") || symptoms.includes("spots"))
    ) {
      disease = "Possible Chilli Leaf Spot";
      advice =
        "Remove severely affected leaves, avoid overhead watering and maintain good air circulation around the plants.";
      matched = true;
    }
  }


  /* =========================
     MAIZE / CORN
  ========================= */

  else if (
    crop.includes("maize") ||
    crop.includes("corn")
  ) {

    if (
      (symptoms.includes("brown") || symptoms.includes("gray") || symptoms.includes("grey")) &&
      (symptoms.includes("spot") || symptoms.includes("spots"))
    ) {
      disease = "Possible Maize Leaf Spot";
      advice =
        "Remove heavily affected plant material where practical, maintain good crop management and follow locally recommended disease-control practices.";
      matched = true;
    }

    else if (
      symptoms.includes("yellow") &&
      (symptoms.includes("leaf") || symptoms.includes("leaves"))
    ) {
      disease = "Possible Maize Nutrient Stress";
      advice =
        "Check soil fertility, water availability and drainage. Compare affected plants with healthy plants.";
      matched = true;
    }
  }


  /* =========================
     GENERAL RESULT
  ========================= */

  if (!matched) {
    disease = "No specific condition matched";
    advice =
      "The symptoms do not closely match the conditions currently stored in Ujumbo. Try describing the colour, spots, curling, holes, wilting or other visible symptoms in more detail.";
  }

  result.style.display = "block";

  result.innerHTML = `
    <h3>🌿 Result</h3>
    <p><strong>Crop:</strong> ${crop}</p>
    <p><strong>Possible condition:</strong> ${disease}</p>
    <p><strong>Management advice:</strong> ${advice}</p>
    <p><strong>⚠️ Note:</strong> This is an initial assessment, not a laboratory diagnosis.</p>
  `;
}

</script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => {
        console.log("Ujumbo offline mode ready");
      })
      .catch(error => {
        console.log("Offline mode error:", error);
      });
  });
}
  </script>

</body>
</html>
