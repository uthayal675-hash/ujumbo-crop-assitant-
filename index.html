curl:{name:{en:'Possible leaf curl problem',ta:'இலைச் சுருட்டல் பிரச்சனை இருக்கலாம்',hi:'पत्ती मुड़ने की समस्या संभव है',te:'ఆకులు ముడుచుకునే సమస్య ఉండవచ్చు',kn:'ಎಲೆ ಸುರುಳಿಯಾಗುವ ಸಮಸ್ಯೆ ಇರಬಹುದು',ml:'ഇല ചുരുളൽ പ്രശ്നം ഉണ്ടാകാം'},advice:{en:'Check for whiteflies, aphids or other insects; curling can have several causes. Seek expert confirmation.',ta:'வெள்ளை ஈ, அசுவினி போன்ற பூச்சிகள் உள்ளனவா பாருங்கள். இலைச் சுருட்டலுக்கு பல காரணங்கள் இருக்கலாம். நிபுணரிடம் உறுதிப்படுத்தவும்.',hi:'सफेद मक्खी और माहू जैसे कीट देखें। पत्ती मुड़ने के कई कारण हो सकते हैं। विशेषज्ञ से पुष्टि कराएँ।',te:'తెల్లదోమలు, పేనుబంక వంటి పురుగులను పరిశీలించండి. ఆకులు ముడుచుకోవడానికి అనేక కారణాలు ఉండవచ్చు.',kn:'ಬಿಳಿನೊಣ ಮತ್ತು ಹೇನುಗಳಿಗಾಗಿ ಪರಿಶೀಲಿಸಿ. ಎಲೆ ಸುರುಳಿಯಾಗಲು ಹಲವು ಕಾರಣಗಳಿರಬಹುದು. ತಜ್ಞರ ಸಲಹೆ ಪಡೆಯಿರಿ.',ml:'വെള്ളീച്ച, മുഞ്ഞ തുടങ്ങിയ കീടങ്ങളുണ്ടോ പരിശോധിക്കുക. ഇല ചുരുളലിന് പല കാരണങ്ങളുണ്ടാകാം.'}},
spots:{name:{en:'Possible leaf spot disease',ta:'இலைப்புள்ளி நோய் இருக்கலாம்',hi:'पत्ती धब्बा रोग संभव है',te:'ఆకు మచ్చల వ్యాధి ఉండవచ్చు',kn:'ಎಲೆ ಚುಕ್ಕೆ ರೋಗ ಇರಬಹುದು',ml:'ഇലപ്പുള്ളി രോഗം ഉണ്ടാകാം'},advice:{en:'Inspect the pattern of spots, reduce prolonged leaf wetness and consult a local agricultural expert.',ta:'புள்ளிகளின் வடிவத்தை கவனிக்கவும். இலைகள் நீண்ட நேரம் ஈரமாக இருப்பதைத் தவிர்த்து வேளாண் நிபுணரை அணுகவும்.',hi:'धब्बों का आकार जाँचें, पत्तियों पर लंबे समय तक नमी से बचें और कृषि विशेषज्ञ से सलाह लें।',te:'మచ్చల ఆకారాన్ని పరిశీలించండి, ఆకులపై ఎక్కువసేపు తేమ ఉండకుండా చూసి నిపుణుడిని సంప్రదించండి.',kn:'ಕಲೆಗಳ ಆಕಾರ ಗಮನಿಸಿ, ಎಲೆಗಳು ದೀರ್ಘಕಾಲ ಒದ್ದೆಯಾಗದಂತೆ ನೋಡಿಕೊಂಡು ತಜ್ಞರನ್ನು ಸಂಪರ್ಕಿಸಿ.',ml:'പാടുകളുടെ രൂപം പരിശോധിക്കുക. ഇലകളിൽ ദീർഘനേരം ഈർപ്പം നിലനിൽക്കുന്നത് ഒഴിവാക്കി വിദഗ്ധനെ സമീപിക്കുക.'}},
powder:{name:{en:'Possible powdery mildew',ta:'சாம்பல் நோய் (பவுடரி மில்டியூ) இருக்கலாம்',hi:'चूर्णिल आसिता संभव है',te:'బూడిద తెగులు ఉండవచ్చు',kn:'ಬೂದಿ ರೋಗ ಇರಬಹುದು',ml:'പൗഡറി മിൽഡ്യൂ ഉണ്ടാകാം'},advice:{en:'Check for a powdery coating on leaves, improve airflow and seek crop-specific advice.',ta:'இலைகளில் வெள்ளைத் தூள் படலம் உள்ளதா பாருங்கள். காற்றோட்டத்தை மேம்படுத்தி பயிருக்கு ஏற்ற ஆலோசனை பெறவும்.',hi:'पत्तियों पर सफेद चूर्ण देखें, हवा का प्रवाह बढ़ाएँ और फसल-विशेष सलाह लें।',te:'ఆకులపై తెల్లటి పొడి ఉందో చూడండి. గాలి ప్రసరణ మెరుగుపరచి పంటకు తగిన సలహా పొందండి.',kn:'ಎಲೆಗಳ ಮೇಲೆ ಬಿಳಿ ಪುಡಿ ಇದೆಯೇ ನೋಡಿ. ಗಾಳಿಯ ಹರಿವು ಸುಧಾರಿಸಿ ಬೆಳೆ-ನಿರ್ದಿಷ್ಟ ಸಲಹೆ ಪಡೆಯಿರಿ.',ml:'ഇലകളിൽ വെളുത്ത പൊടി ഉണ്ടോ പരിശോധിക്കുക. വായുസഞ്ചാരം മെച്ചപ്പെടുത്തി വിളയ്ക്കനുസരിച്ചുള്ള ഉപദേശം തേടുക.'}},
yellow:{name:{en:'Possible yellowing / nutrient or water stress',ta:'ஊட்டச்சத்து அல்லது நீர் பாதிப்பால் இலை மஞ்சளாகியிருக்கலாம்',hi:'पोषक तत्व या पानी के तनाव से पत्तियाँ पीली हो सकती हैं',te:'పోషకాలు లేదా నీటి ఒత్తిడి వల్ల ఆకులు పసుపుగా మారవచ్చు',kn:'ಪೋಷಕಾಂಶ ಅಥವಾ ನೀರಿನ ಒತ್ತಡದಿಂದ ಎಲೆ ಹಳದಿಯಾಗಿರಬಹುದು',ml:'പോഷകക്കുറവോ ജലസമ്മർദ്ദമോ മൂലം ഇല മഞ്ഞയായിരിക്കാം'},advice:{en:'Check soil moisture, drainage, nutrient status and insects; yellow leaves alone cannot confirm a disease.',ta:'மண் ஈரம், வடிகால், ஊட்டச்சத்து, பூச்சிகள் ஆகியவற்றைப் பாருங்கள். மஞ்சள் இலை மட்டும் நோயை உறுதி செய்யாது.',hi:'मिट्टी की नमी, जल निकासी, पोषण और कीट जाँचें। केवल पीली पत्तियों से रोग की पुष्टि नहीं होती।',te:'నేల తేమ, నీటి పారుదల, పోషకాలు, పురుగులను పరిశీలించండి. పసుపు ఆకులతో మాత్రమే వ్యాధి నిర్ధారణ కాదు.',kn:'ಮಣ್ಣಿನ ತೇವಾಂಶ, ನೀರು ಹರಿವು, ಪೋಷಕಾಂಶ ಮತ್ತು ಕೀಟಗಳನ್ನು ಪರಿಶೀಲಿಸಿ. ಹಳದಿ ಎಲೆಗಳಿಂದ ಮಾತ್ರ ರೋಗ ಖಚಿತವಾಗುವುದಿಲ್ಲ.',ml:'മണ്ണിലെ ഈർപ്പം, നീർവാർച്ച, പോഷകങ്ങൾ, കീടങ്ങൾ എന്നിവ പരിശോധിക്കുക. മഞ്ഞ ഇലകൾ മാത്രം രോഗം സ്ഥിരീകരിക്കില്ല.'}}
};
const symptomCodes={brown:'brown spots on leaves',yellow:'yellow leaves',curl:'curled leaves',white:'white powder on leaves',black:'black spots on leaves'};
const cropNames=['Tomato','Rice','Potato','Chilli','Maize'];
let currentCase=null;
function language(){return document.getElementById('language').value}
function tr(k){return translations[language()][k]||translations.en[k]||k}
function setLanguage(){const lang=language();document.documentElement.lang=lang;localStorage.setItem('ujumbo-language',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.placeholder));const crop=document.getElementById('crop');const selected=crop.value;crop.replaceChildren();[['',tr('select')],...cropNames.map(n=>[n,tr(n)])].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;crop.append(option)});crop.value=selected;const buttons=document.getElementById('symptomButtons');buttons.replaceChildren();Object.keys(symptomCodes).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=tr(k);b.onclick=()=>{document.getElementById('symptoms').value=symptomCodes[k];document.getElementById('symptoms').dataset.symptom=k};buttons.append(b)});if(document.getElementById('photoPreview').style.display==='block')document.getElementById('photoMessage').textContent=tr('photoAdded');if(currentCase)renderResult()}
function pickCase(crop,symptoms){const s=symptoms.toLowerCase();if(crop==='Tomato'&&/brown|dark/.test(s)&&/spot/.test(s))return 'early';if(/curl|curled|curling/.test(s))return 'curl';if(/white/.test(s)&&/powder|coating/.test(s))return 'powder';if(/brown|black|dark/.test(s)&&/spot/.test(s))return 'spots';if(/yellow/.test(s))return 'yellow';return null}
function renderResult(){const box=document.getElementById('result');box.style.display='block';box.replaceChildren();const add=(tag,txt)=>{const el=document.createElement(tag);el.textContent=txt;box.append(el)};if(currentCase.error){add('strong',tr('required'));return}const c=cases[currentCase.key];add('h3','🌿 '+tr('result'));add('p',tr('crop')+': '+tr(currentCase.crop));add('p',tr('condition')+': '+(c?c.name[language()]:tr('noMatch')));add('p',tr('advice')+': '+(c?c.advice[language()]:tr('noMatchAdvice')));add('p','⚠️ '+tr('note')+': '+tr('noteText'))}
function analyze(){const crop=document.getElementById('crop').value;const symptoms=document.getElementById('symptoms').value.trim();currentCase=(!crop||!symptoms)?{error:true}:{crop,key:pickCase(crop,symptoms)};renderResult()}
document.getElementById('language').addEventListener('change',setLanguage);document.getElementById('analyze').addEventListener('click',analyze);document.getElementById('symptoms').addEventListener('input',()=>{delete document.getElementById('symptoms').dataset.symptom});document.getElementById('cropPhoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=document.getElementById('photoPreview');if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);const url=URL.createObjectURL(f);img.src=url;img.dataset.url=url;img.style.display='block';document.getElementById('photoMessage').textContent=tr('photoAdded')});document.getElementById('speak').addEventListener('click',()=>{if(!currentCase||currentCase.error){alert(tr('noResult'));return}if(!('speechSynthesis' in window)){alert('Speech synthesis not supported on this device');return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(document.getElementById('result').innerText);utterance.lang=({en:'en-IN',ta:'ta-IN',hi:'hi-IN',te:'te-IN',kn:'kn-IN',ml:'ml-IN'})[language()];speechSynthesis.speak(utterance)});document.getElementById('save').addEventListener('click',()=>{if(!currentCase||currentCase.error){alert(tr('noResult'));return}try{const reports=JSON.parse(localStorage.getItem('ujumbo-reports')||'[]');reports.push({date:new Date().toISOString(),crop:currentCase.crop,symptoms:document.getElementById('symptoms').value,caseKey:currentCase.key});localStorage.setItem('ujumbo-reports',JSON.stringify(reports));alert(tr('saved'))}catch(e){alert('Storage unavailable')}});document.getElementById('language').value=localStorage.getItem('ujumbo-language')||'en';setLanguage();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));

<script>
const symptomTranslations = {
  en: [
    "🟤 Brown spots",
    "🟡 Yellow leaves",
    "🍃 Curled leaves",
    "⚪ White powder",
    "⚫ Black spots"
  ],
  ta: [
    "🟤 பழுப்பு நிற புள்ளிகள்",

  ],

    "🍃 ముడుచుకున్న ఆకులు",
    "⚪ తెల్లటి పొడి",
    "⚫ నల్లటి మచ్చలు"
  ],

    "⚪ ಬಿಳಿ ಪುಡಿ",
    "⚫ ಕಪ್ಪು ಕಲೆಗಳು"
  ]
};

const symptomButtons = document.querySelectorAll(
  ".symptoms button"
);

const originalSelectSymptom = window.selectSymptom;

window.selectSymptom = function(symptom) {
  const lang = document.getElementById("language").value;

  const symptomValues = [
    "Brown spots on leaves",
    "Yellow leaves",
    "Curled leaves",
    "White powder on leaves",
    "Black spots on leaves"
  ];

  const index = symptomValues.indexOf(symptom);

  if (index !== -1) {
    document.getElementById("symptoms").value =
      symptomTranslations[lang]?.[index] ||
      symptomTranslations.en[index];
  } else {
    originalSelectSymptom(symptom);
  }
};

function updateSymptomLanguage() {
  const lang = document.getElementById("language").value;
  const labels = symptomTranslations[lang] ||
                 symptomTranslations.en;

  symptomButtons.forEach((button, index) => {
    if (index < labels.length) {
      button.textContent = labels[index];
    }
  });
}

document.getElementById("language")
  .addEventListener("change", updateSymptomLanguage);

updateSymptomLanguage();
